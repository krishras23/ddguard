name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  # fixtures/tfplan.json is deliberately broken, so this is a demo, not a gate: it asserts
  # ddguard still finds every seeded defect. The gate runs against the PR's own plan and
  # lives in the repo being guarded — see "Wiring it into CI" in the README.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: the seeded defects are still caught
        shell: bash
        run: |
          set -o pipefail
          make demo | tee out.txt
          grep -q 'ddguard exited 1' out.txt
          test "$(grep -c '^FAIL' out.txt)" = 3
      # invoked directly, not via make: GNU make exits 2 on any recipe failure, so it
      # cannot carry ddguard's own exit code, which is the thing being asserted here
      - name: markdown report to the job summary
        shell: bash
        run: |
          set -o pipefail
          node mockdd/seed.js
          node mockdd/server.js & mock=$!
          until curl -sf -o /dev/null http://localhost:8126/health; do sleep 0.2; done
          status=0
          node ddguard/bin/ddguard.js fixtures/tfplan.json --days=30 --format=markdown \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          kill $mock
          test "$status" -eq 1 || { echo "::error::expected exit 1 from the fixture plan, got $status"; exit 1; }

  # builds the same image the release workflow ships, so a broken Dockerfile is caught
  # on the PR rather than on the tag
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ddguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the image catches the seeded defects
        shell: bash
        run: |
          set -o pipefail
          status=0
          docker run --rm ddguard:ci | tee out.txt || status=$?
          test "$status" -eq 1 || { echo "::error::expected exit 1 from the demo, got $status"; exit 1; }
          test "$(grep -c '^FAIL' out.txt)" = 3
          docker run --rm ddguard:ci --help | grep -q '^usage: ddguard'
