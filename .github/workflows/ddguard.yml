name: ddguard

on:
  pull_request:
    paths:
      - 'fixtures/**'
      - 'ddguard/**'
      - 'mockdd/**'
      - '.github/workflows/ddguard.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: make check | tee -a "$GITHUB_STEP_SUMMARY"
